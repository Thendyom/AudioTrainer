[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiotrainer"
version = "0.2.0"
description = "Efficient audio coaching tools for pitch, transcription, speech prosody, voice profiling, and instruments."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AudioTrainer contributors" }]
keywords = ["audio", "pitch-detection", "music", "speech", "voice", "coaching"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pydantic>=2",
  "typer>=0.9",
  "rich>=13",
  "soundfile>=0.12",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
app = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "streamlit>=1.37",
  "matplotlib>=3.7",
  "python-multipart>=0.0.9",
]
visualization = ["matplotlib>=3.7"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13"]

[project.urls]
Homepage = "https://github.com/Thendyom/AudioTrainer"
Repository = "https://github.com/Thendyom/AudioTrainer"
Issues = "https://github.com/Thendyom/AudioTrainer/issues"

[project.scripts]
audiotrainer = "audiotrainer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not ui'"
markers = [
  "ui: Streamlit application smoke and interaction tests",
]

[tool.coverage.run]
source = ["audiotrainer"]
omit = [
  "src/audiotrainer/cli.py",
  "src/audiotrainer/audio/device.py",
  "src/audiotrainer/coaching/sessions.py",
  "src/audiotrainer/visualization/*",
]

[tool.coverage.report]
fail_under = 85

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]
